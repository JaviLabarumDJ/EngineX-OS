<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EngineX OS · Console</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--card:rgba(22,27,36,.72);--line:rgba(255,255,255,.07);--text:#e8edf4;--dim:#8c97a8;--accent:#2ee6d6;--accent2:#34d399;--warn:#f6c453;--bad:#ff6b6b;--field:#121820;font:16px/1.45 -apple-system,"SF Pro Text","PingFang SC","PingFang TC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,rgba(46,230,214,.10),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(124,92,255,.10),transparent 60%),var(--bg)}
.wrap{max-width:1180px;margin:auto;padding:16px 18px 80px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:rgba(7,9,13,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;font-size:18px}.brand svg{flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);white-space:nowrap}
.pill.ver{color:var(--accent);border-color:rgba(46,230,214,.35)}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
#guard{overflow:hidden;text-overflow:ellipsis;max-width:42vw}.spacer{flex:1}
.langs{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.langs button{border:0;background:none;color:var(--dim);padding:6px 12px;border-radius:999px;font:inherit;font-size:13.5px;cursor:pointer;min-height:0}.langs button.on{background:var(--accent);color:#04201d;font-weight:700}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}.col{display:grid;gap:16px;min-width:0}.grid>*{min-width:0}.full{grid-column:1/-1}
@media(max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}#guard{max-width:60vw}}@media(max-width:560px){.wrap{padding:12px 10px 80px}.card{padding:14px}.setting{flex-wrap:wrap}.setting .seg{width:100%}.seg button{flex:1}.bar>input,.bar>select{min-width:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:16px;letter-spacing:.02em}.card h2 .ic{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:rgba(46,230,214,.12);color:var(--accent);font-size:16px}
button,select,input{font:inherit;color:inherit}
.btn{min-height:42px;padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;transition:.15s}.btn:hover{border-color:rgba(46,230,214,.5)}.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:linear-gradient(135deg,#2ee6d6,#34d399);border:0;color:#04201d;font-weight:700}
input,select{min-height:42px;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--field);width:100%}input:focus,select:focus,.btn:focus-visible,.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.bar>input,.bar>select{flex:1;min-width:160px}
small,.sub{display:block;color:var(--dim);font-size:13px;line-height:1.4}
.providers{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.prov{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;text-align:left;transition:.15s}.prov:hover{transform:translateY(-1px);border-color:var(--c)}.prov img{width:24px;height:24px;border-radius:7px;flex:none}.prov.ok{border-color:var(--c)}.prov.off{opacity:.55;cursor:default;transform:none}
.setting{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.setting:first-of-type{border-top:0}.setting .txt{flex:1;min-width:0}.setting.warn b,.setting.warn #spState{color:#ff9f43}.setting b{display:block;font-weight:600;font-size:14.5px}
.sw{position:relative;width:50px;height:28px;flex:none}.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;min-height:0}.sw span{position:absolute;inset:0;border-radius:999px;background:#2a313d;transition:.2s;pointer-events:none}.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfd6e0;transition:.2s}
.sw input:checked+span{background:linear-gradient(135deg,#14b8a6,#34d399);box-shadow:0 0 14px rgba(46,230,214,.55)}.sw input:checked+span::after{transform:translateX(22px);background:#fff}.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}.sw input:disabled+span{opacity:.5}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:12px;background:var(--field);border:1px solid var(--line)}.seg button{border:0;background:none;color:var(--dim);min-height:34px;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:14px}.seg button.on{background:rgba(46,230,214,.16);color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px rgba(46,230,214,.4)}
.setting .why{color:var(--warn)}.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(246,196,83,.15);color:var(--warn);margin-left:6px;vertical-align:middle;font-weight:600}
.rows{display:grid;gap:8px;max-height:46vh;overflow:auto;margin-top:8px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px}.row span{flex:1;overflow-wrap:anywhere}
.store{height:8px;border-radius:99px;background:#1d2430;overflow:hidden;margin:4px 0 2px}.store i{display:block;height:100%;background:linear-gradient(90deg,#14b8a6,#34d399)}.store.full i{background:linear-gradient(90deg,#f59e0b,#ef4444)}
#dropZone{display:grid;place-items:center;gap:6px;padding:26px 14px;border:2px dashed #2f3a4a;border-radius:16px;text-align:center;cursor:pointer;transition:.15s;background:rgba(255,255,255,.02)}#dropZone:hover,#dropZone.over{border-color:var(--accent);background:rgba(46,230,214,.06)}#dropZone .big{font-size:28px}
progress{width:100%;height:8px;border-radius:99px;overflow:hidden;accent-color:var(--accent);appearance:none}progress::-webkit-progress-bar{background:#1d2430}progress::-webkit-progress-value{background:linear-gradient(90deg,#14b8a6,#34d399)}
.job{padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:rgba(255,255,255,.03)}
canvas{width:100%;height:70px;border-radius:10px;background:#05070a;margin-top:8px}
details.card{padding:0}details.card>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:10px;font-weight:600}details.card>summary::-webkit-details-marker{display:none}details.card>summary::after{content:"›";margin-left:auto;color:var(--dim);transition:.2s;font-size:20px}details.card[open]>summary::after{transform:rotate(90deg)}details.card>.in{padding:0 18px 18px}
#notice{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92vw;padding:10px 16px;border-radius:12px;background:rgba(40,30,8,.92);border:1px solid rgba(246,196,83,.4);color:var(--warn);font-size:14px;z-index:9}#notice:empty{display:none}
#login{display:none;margin-top:12px;padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line)}#qr{width:200px;max-width:60vw;background:#fff;border-radius:10px;padding:6px}
a{color:var(--accent)}label.chk{display:flex;align-items:center;gap:10px;cursor:pointer}
</style>
<header>
 <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="#2ee6d6" stroke-width="2"/><path d="M6 13h2l2-5 3 10 2-7 2 4h3" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>EngineX OS</div>
 <span class="pill ver" id="version" hidden></span>
 <span class="pill"><span class="dot"></span><span id="guard" data-i18n="queueIdle"></span></span>
 <span class="spacer"></span>
 <div class="langs" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="zh-Hans">简体中文</button><button data-lang="zh-Hant">繁體中文</button></div>
</header>
<div class="wrap">
<div class="grid">
<div class="col">
 <section class="card">
  <h2><span class="ic">♫</span><span data-i18n="streaming"></span></h2>
  <div class="providers">
   <button class="prov" data-provider="netease" style="--c:#e60026"><img src="/icons/netease" alt=""><span data-i18n="pNetease"></span></button>
   <button class="prov" data-provider="spotify" style="--c:#1ed760"><img src="/icons/spotify" alt="">Spotify</button>
   <button class="prov" data-provider="applemusic" style="--c:#fa2d48"><img src="/icons/applemusic" alt="">Apple Music</button>
   <button class="prov" data-provider="soundcloud" style="--c:#ff5500"><img src="/icons/soundcloud" alt="">SoundCloud</button>
   <button class="prov" data-provider="deezer" style="--c:#a238ff"><img src="/icons/deezer" alt="">Deezer</button>
   <button class="prov" data-provider="beatport" style="--c:#01ff95"><img src="/icons/beatport" alt="">Beatport</button>
   <button class="prov off" id="tidalInfo" style="--c:#ffffff" aria-disabled="true"><img src="/icons/tidal" alt="">TIDAL</button>
  </div>
  <div class="setting" id="spRow"><div class="txt"><b data-i18n="spTitle"></b><span class="sub" id="spState"></span><span class="sub" data-i18n="spHow"></span></div></div>
  <div class="bar"><input id="spClient" data-i18n-ph="spClient" autocomplete="off" spellcheck="false"><button class="btn primary" onclick="action(saveSpotify)" data-i18n="save"></button></div>
  <div class="setting"><div class="txt"><b data-i18n="guest"></b><span class="sub" data-i18n="guestSub"></span></div><label class="sw"><input type="checkbox" id="guest"><span></span></label></div>
  <div class="bar"><input id="user" data-i18n-ph="deezerUser" data-i18n-aria="deezerUser"></div>
  <div class="bar"><select id="sessions" data-i18n-aria="account"></select></div>
  <div class="bar"><button class="btn primary" id="browse" data-i18n="browse"></button><button class="btn" id="relogin" data-i18n="relogin"></button><button class="btn" id="logout" data-i18n="logout"></button></div>
  <div id="login"><img id="qr" data-i18n-alt="loginQr"><p><a id="auth" target="_blank" rel="noreferrer" data-i18n="openOnPhone"></a></p><button class="btn" id="check" data-i18n="checkNetease"></button><small id="loginStatus"></small></div>
 </section>
 <section class="card">
  <h2><span class="ic">≡</span><span id="heading" data-i18n="playlists"></span></h2>
  <div class="bar"><input id="playlistID" data-i18n-ph="playlistId" data-i18n-aria="playlistId"><button class="btn" id="open" data-i18n="openId"></button></div>
  <div id="rows" class="rows"></div>
 </section>
 <section class="card">
  <h2><span class="ic">⇪</span><span data-i18n="drop"></span></h2>
  <div class="bar"><select id="dropDrive" data-i18n-aria="dropDrive"></select></div>
  <div class="store" id="dropStore"><i style="width:0"></i></div><small id="dropStoreText"></small>
  <div class="bar"><input id="dropPlaylist" placeholder="Wi-Fi Drop" data-i18n-aria="dropFolder"></div>
  <label id="dropZone" for="dropFiles" tabindex="0"><span class="big">⤓</span><span data-i18n="dropHere"></span><small>MP3 · FLAC · WAV · AIFF · M4A · AAC · OGG · OPUS</small><input id="dropFiles" type="file" multiple accept=".mp3,.flac,.wav,.aiff,.aif,.m4a,.aac,.ogg,.opus,audio/*" style="display:none"></label>
  <progress id="dropProgress" max="1" value="0" hidden></progress>
  <small id="dropState" role="status" data-i18n="dropHint"></small>
 </section>
 <section class="card">
  <h2><span class="ic">⌕</span><span data-i18n="relocate"></span></h2>
  <small data-i18n="relocateHint"></small>
  <div class="bar"><button class="btn" id="relScan" data-i18n="relScan"></button><button class="btn" id="relApply" data-i18n="relApply" disabled></button></div>
  <small id="relState" role="status"></small>
  <div id="relRows" class="rows"></div>
 </section>
</div>
<div class="col">
 <section class="card">
  <h2><span class="ic">◐</span><span data-i18n="deck"></span></h2>
  <div class="setting"><div class="txt"><b data-i18n="quality"></b><span class="sub" data-i18n="qualitySub"></span></div><div class="seg" data-seg="quality"><button data-v="flac">FLAC</button><button data-v="320k">320 kbps</button></div></div>
  <div class="setting"><div class="txt"><b data-i18n="deckLang"></b><span class="sub" data-i18n="deckLangSub"></span></div><div class="seg" data-seg="lang"><button data-v="en">English</button><button data-v="zh-Hans">简体中文</button><button data-v="zh-Hant">繁體中文</button></div></div>
  <div class="setting"><div class="txt"><b data-i18n="waveform"></b><span class="sub" data-i18n="waveformSub"></span></div><div class="seg" data-seg="waveform"><button data-v="denon" data-i18n="wDenon"></button><button data-v="rgb">RGB</button><button data-v="3band">3-Band</button></div></div>
  <div class="setting"><div class="txt"><b data-i18n="tFourDeck"></b><span class="sub" data-i18n="sFourDeck"></span></div><label class="sw"><input type="checkbox" data-toggle="fourDeckWaveform"><span></span></label></div>
  <div class="setting" id="fourDeckRoleRow"><div class="txt"><b data-i18n="tRole"></b><span class="sub" data-i18n="sRole"></span></div><div class="seg" data-seg="fourDeckRole"><button data-v="auto" data-i18n="rAuto"></button><button data-v="13">1+3</button><button data-v="24">2+4</button><button data-v="12">1+2</button><button data-v="1">1</button><button data-v="2">2</button></div></div>
  <div class="setting"><div class="txt"><b data-i18n="tEcho"></b><span class="sub" data-i18n="sEcho"></span></div><label class="sw"><input type="checkbox" data-toggle="upfaderEcho"><span></span></label></div>
  <div class="setting"><div class="txt"><b data-i18n="tLimiter"></b><span class="sub" data-i18n="sLimiter"></span></div><label class="sw"><input type="checkbox" data-toggle="masterLimiter"><span></span></label></div>
  <div class="setting"><div class="txt"><b data-i18n="tGain"></b><span class="sub" data-i18n="sGain"></span></div><label class="sw"><input type="checkbox" data-toggle="autoGain"><span></span></label></div>
  <div class="setting"><div class="txt"><b data-i18n="tOmni"></b><span class="sub" data-i18n="sOmni"></span></div><label class="sw"><input type="checkbox" data-toggle="omniSource"><span></span></label></div>
  <div class="setting"><div class="txt"><b data-i18n="tAnalyze"></b><span class="sub" data-i18n="sAnalyze"></span></div><label class="sw"><input type="checkbox" data-toggle="autoAnalyze"><span></span></label></div>
  <div class="setting"><div class="txt"><b data-i18n="tShare"></b><span class="sub" data-i18n="sShare"></span></div><label class="sw"><input type="checkbox" data-toggle="prolinkShare"><span></span></label></div>
  <div class="setting"><div class="txt"><b><span data-i18n="tExport"></span><span class="tag" data-i18n="beta"></span></b><span class="sub" data-i18n="sExport"></span></div><label class="sw"><input type="checkbox" data-toggle="prolinkExport"><span></span></label></div>
  <div class="setting"><div class="txt"><b data-i18n="verboseLog"></b><span class="sub" data-i18n="verboseLogSub"></span></div><label class="sw"><input type="checkbox" data-toggle="verboseLog"><span></span></label><a class="btn" href="/api/logs" download="enginex-logs.txt" data-i18n="downloadLogs"></a></div>
  <small id="uiState"></small>
 </section>
 <section class="card">
  <h2><span class="ic">↧</span><span data-i18n="jobsTitle"></span></h2>
  <div id="jobs"></div><canvas id="wave" width="1024" height="70" data-i18n-aria="waveAria" hidden></canvas>
 </section>
</div>
<details class="card"><summary><span class="ic">📡</span><span data-i18n="bcTitle"></span></summary><div class="in"><small id="bcState"></small><div class="bar"><input id="bcUrl" data-i18n-ph="bcUrl" autocomplete="off" style="flex:2"><input id="bcMount" placeholder="/live" autocomplete="off"></div><div class="bar"><select id="bcProto"><option value="icecast">Icecast</option><option value="shoutcast">Shoutcast</option></select><select id="bcFmt"><option value="mp3">MP3</option><option value="ogg">OGG / Opus</option><option value="wav">WAV (PCM)</option></select><select id="bcBr"><option value="192">192 kbps</option><option value="128">128 kbps</option><option value="256">256 kbps</option><option value="320">320 kbps</option></select></div><div class="bar"><input id="bcUser" placeholder="source" data-i18n-ph="bcUser" autocomplete="off"><input id="bcPass" type="password" data-i18n-ph="bcPass" autocomplete="off"></div><div class="bar"><button class="btn" onclick="action(saveBroadcast)" data-i18n="bcSave"></button><button class="btn primary" id="bcToggle" onclick="action(toggleBroadcast)" data-i18n="bcStart"></button></div></div></details>
<details class="card"><summary><span class="ic">☁</span><span data-i18n="relayTitle"></span></summary><div class="in"><small id="relayState"></small><div class="bar"><input id="relayUrl" data-i18n-ph="relayUrl" autocomplete="off"></div><div class="bar"><input id="relayPassword" type="password" data-i18n-ph="newPassword" autocomplete="off"></div><button class="btn" onclick="action(saveRelay)" data-i18n="save"></button></div></details>
<details class="card" id="cfCard"><summary><span class="ic">🌐</span><span data-i18n="cfTitle"></span></summary><div class="in"><small data-i18n="cfHint"></small><small id="cfState"></small><div class="bar" id="cfUrlRow" hidden><a id="cfUrl" target="_blank" rel="noopener noreferrer" style="flex:1;overflow-wrap:anywhere;font-weight:700"></a><button class="btn" id="cfCopy" type="button" data-i18n="cfCopy"></button></div><small id="cfMobileHint" data-i18n="cfMobileHint" hidden></small><div class="bar"><button class="btn primary" id="cfToggle" type="button" data-i18n="cfStart"></button></div><details style="margin-top:8px"><summary style="cursor:pointer;color:var(--dim);font-size:13px" data-i18n="cfNamedToggle"></summary><div class="bar"><input id="cfToken" type="password" data-i18n-ph="cfTokenPh" autocomplete="off" spellcheck="false"><button class="btn" id="cfSaveToken" type="button" data-i18n="save"></button></div></details></div></details>
<section class="card full" id="modHub"><h2><span class="ic">🧩</span><span data-i18n="modTitle"></span></h2><small data-i18n="modArch"></small>
<div class="bar"><a class="btn" href="https://enginexdj.com/#mods" target="_blank" rel="noopener" data-i18n="modBrowse"></a></div>
<div id="modQuar" class="setting warn" hidden><div class="txt"><b data-i18n="modQuarMsg"></b></div><button class="btn" id="modQuarReset" data-i18n="modQuarBtn"></button></div>
<div id="modRows" class="rows"></div>
<label id="modDrop" for="modFile" style="display:block;margin-top:10px;padding:18px 14px;border:2px dashed #2f3a4a;border-radius:16px;text-align:center;cursor:pointer"><span data-i18n="modDrop"></span><input id="modFile" type="file" accept=".tar.gz,.tgz,application/gzip" hidden></label><small id="modUp"></small></section>
<details class="card"><summary><span class="ic">⛓</span><span data-i18n="tsTitle"></span></summary><div class="in"><small data-i18n="tsHint"></small><small id="tsState"></small><div class="bar"><input id="tsServer" data-i18n-ph="tsServer" autocomplete="off" spellcheck="false"></div><div class="bar"><input id="tsName" data-i18n-ph="tsName" autocomplete="off" spellcheck="false"><input id="tsKey" type="password" data-i18n-ph="tsKey" autocomplete="off"></div><div class="setting"><div class="txt"><b data-i18n="tsFwSsh"></b></div><label class="sw"><input type="checkbox" id="tsSsh"><span></span></label></div><div class="setting"><div class="txt"><b data-i18n="tsFwWeb"></b></div><label class="sw"><input type="checkbox" id="tsWeb"><span></span></label></div><div class="bar"><button class="btn primary" id="tsInstall" data-i18n="tsInstall" hidden></button><button class="btn" id="tsToggle" hidden></button><button class="btn" id="tsLogin" data-i18n="tsLogin" hidden></button><button class="btn" id="tsLogout" data-i18n="tsLogout" hidden></button></div><a id="tsLink" target="_blank" rel="noopener noreferrer" data-i18n="tsOpenLink" hidden></a></div></details>

 try{

  $('loginStatus').textContent=({800:t('qrExpired'),801:t('qrWait'),802:t('qrConfirm'),803:t('qrDone')})[r.code]||t('retry');

function renderJobs(data,force){

 $('jobs').replaceChildren();
 const states={queued:'jQueued',matching:'jMatching',downloading:'jDownloading',analyzing:'jAnalyzing',importing:'jImporting',done:'jDone',error:'jError'};

  const d=document.createElement('div');d.className='job';
  const title=document.createElement('div');title.textContent=j.track.title+' · '+(states[j.state]?t(states[j.state]):j.state)+' '+(j.quality||'');
  const p=document.createElement('progress');p.max=1;p.value=j.progress;
  const detail=document.createElement('small');detail.textContent=j.error||j.playlist;
  d.append(title,p,detail);$('jobs').append(d);
 }
 const g=data.resourceGuard;
 if(g)$('guard').textContent='CPU '+(g.cpus||[]).join(',')+' · nice '+g.nice+(g.degraded?.length?' · '+t('degraded')+': '+g.degraded.join('; '):' · '+t('lowPrio'));
}

 }

const kinds={internal:'kInternal',hd:'kHd',sd:'kSd',usb:'kUsb',drive:'kDrive'},gb=n=>(n/2**30).toFixed(1);
function renderDrives(){const sel=$('dropDrive'),keep=sel.value;sel.replaceChildren();for(const d of lastDrives){const o=document.createElement('option');o.value=d.name;o.textContent=t(kinds[d.kind]||'kDrive')+' · '+d.name+' · '+t('free',gb(d.free));sel.append(o)}if(!lastDrives.length){const o=document.createElement('option');o.textContent=t('noDrive');o.disabled=true;o.selected=true;sel.append(o)}if(lastDrives.some(d=>d.name===keep))sel.value=keep;showStore()}
function showStore(){const d=lastDrives.find(v=>v.name===$('dropDrive').value),bar=$('dropStore');if(!d||!d.total){bar.hidden=true;$('dropStoreText').textContent='';return}const used=1-d.free/d.total;bar.hidden=false;bar.classList.toggle('full',used>.9);bar.firstChild.style.width=Math.round(used*100)+'%';$('dropStoreText').textContent=t('ofTotal',gb(d.free),gb(d.total))}
async function showDrives(){lastDrives=await api('drives');renderDrives()}
$('dropDrive').onchange=showStore;
function dropOne(file){return new Promise((ok,bad)=>{const x=new XMLHttpRequest(),f=new FormData();f.append('file',file,file.name);x.open('POST','/api/drop?drive='+encodeURIComponent($('dropDrive').value)+'&playlist='+encodeURIComponent($('dropPlaylist').value.trim()));x.upload.onprogress=e=>{if(e.lengthComputable){$('dropProgress').hidden=false;$('dropProgress').value=e.loaded/e.total;$('dropState').textContent=file.name+' · '+Math.round(100*e.loaded/e.total)+'%'}};x.onload=()=>{let v={};try{v=JSON.parse(x.responseText)}catch(e){}x.status===200?ok(v):bad(Error(v.error||x.status))};x.onerror=()=>bad(Error(t('netDown')));x.send(f)})}
async function dropFiles(files){if(!$('dropDrive').value)throw Error(t('chooseDrive'));let n=0,imp=0;try{for(const file of files){const v=await dropOne(file);n+=v.saved.length;imp+=v.imported}}finally{$('dropProgress').hidden=true}$('dropState').textContent=t('savedN',n)+(imp?t('importingN',imp):'');await showDrives()}
$('dropFiles').onchange=e=>action(()=>dropFiles([...e.target.files]));
$('dropZone').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('dropFiles').click()}};
$('dropZone').ondragover=e=>{e.preventDefault();$('dropZone').classList.add('over')};
$('dropZone').ondragleave=()=>$('dropZone').classList.remove('over');
$('dropZone').ondrop=e=>{e.preventDefault();$('dropZone').classList.remove('over');action(()=>dropFiles([...e.dataTransfer.files]))};
let relPlan=0;
function relRender(v){const box=$('relRows');box.replaceChildren();relPlan=0;let any=false,lines=[];for(const d of v.drives||[]){if(d.error){lines.push(d.name+': '+d.error);continue}if(!d.missing)continue;any=true;lines.push(v.dryRun?t('relSummary',d.name,d.missing,d.moves.length,d.unresolved):t('relDone',d.name,d.moves.length,d.backup||'-'));if(v.dryRun)relPlan+=d.moves.length;for(const m of d.moves.slice(0,200)){const r=document.createElement('div');r.className='row';r.title=t('relTier',m.tier);r.textContent=m.oldPath+' → '+m.newPath;box.append(r)}}$('relState').textContent=any||lines.length?lines.join(' · '):t('relNothing');$('relApply').disabled=!relPlan}
$('relScan').onclick=()=>action(async()=>relRender(await post('relocate',{dryRun:true})));
$('relApply').onclick=()=>action(async()=>{if(!confirm(t('relConfirm',relPlan)))return;relRender(await post('relocate',{dryRun:false}))});
let lastTs={};
const tsBody=x=>({loginServer:$('tsServer').value.trim(),hostname:$('tsName').value.trim(),forward:{ssh:$('tsSsh').checked,webui:$('tsWeb').checked},...x});
function tsText(v){if(!v.supported)return t('tsUnsupported');if(!v.installed)return t('tsNotInstalled');if(!v.running)return t('tsStopped');if(v.state==='Running')return t('tsOnline',v.deviceName,(v.ips||[]).join(', '));if(v.state==='NeedsLogin')return t('tsNeedsLogin');return v.state}
function tsShow(v){lastTs=v;$('tsState').textContent=tsText(v);setVal('tsServer',v.loginServer||'');setVal('tsName',v.hostname||'');$('tsSsh').checked=!!v.forward?.ssh;$('tsWeb').checked=!!v.forward?.webui;$('tsInstall').hidden=v.installed||!v.supported;$('tsToggle').hidden=!v.installed;$('tsToggle').textContent=t(v.enabled?'tsTurnOff':'tsTurnOn');$('tsLogin').hidden=!v.enabled;$('tsLogout').hidden=!v.enabled;$('tsLink').hidden=!v.authUrl;if(v.authUrl)$('tsLink').href=v.authUrl}
async function showGen2(){const v=await api('unlock-gen2');$('gen2Card').hidden=v.generation!==2;$('gen2State').textContent=t(v.unlocked?'gen2On':'gen2Off');$('gen2Unlock').hidden=!!v.unlocked}
$('gen2Unlock').onclick=()=>action(async()=>{await post('unlock-gen2');await showGen2()});
$('gen2Uninstall').onclick=()=>action(async()=>{if(!confirm(t('gen2UninstallConfirm')))return;await post('uninstall-gen2');notice(t('gen2UninstallDone'));await showGen2()});
async function showSSH(){const v=await api('ssh');$('sshEnabled').checked=!!v.enabled;setVal('sshPort',v.port||22);$('sshState').textContent=t(v.running?'sshRunning':'sshStopped')+(v.hasAuthorizedKey?' · '+t('sshKeySet'):'')}
$('sshSave').onclick=()=>action(async()=>{const b={enabled:$('sshEnabled').checked,port:+$('sshPort').value||22};if($('sshPass').value)b.password=$('sshPass').value;if($('sshKey').value.trim())b.authorizedKey=$('sshKey').value;await post('ssh',b);$('sshPass').value='';$('sshKey').value='';await showSSH()});
async function showTailscale(){tsShow(await api('tailscale'))}
$('tsInstall').onclick=()=>action(async()=>tsShow(await post('tailscale',{action:'install'})));
$('tsToggle').onclick=()=>action(async()=>tsShow(await post('tailscale',tsBody({enabled:!lastTs.enabled}))));
$('tsLogin').onclick=()=>action(async()=>{const v=await post('tailscale',tsBody({enabled:true,action:'login',authKey:$('tsKey').value.trim()}));$('tsKey').value='';tsShow(v)});
$('tsLogout').onclick=()=>action(async()=>tsShow(await post('tailscale',tsBody({action:'logout'}))));
$('tsSsh').onchange=$('tsWeb').onchange=()=>action(async()=>tsShow(await post('tailscale',tsBody())));
let lastCf={},cfPollTimer=null;
function cfStatusText(v){if(v.status==='running')return t('cfStRunning')+(v.publicUrl?' · '+v.publicUrl:'');if(v.status==='installing')return t('cfStInstalling');if(v.status==='starting')return t('cfStStarting');if(v.status==='error')return t('cfStError')+(v.error?': '+v.error:'');return t('cfStStopped')}
function cfShow(v){lastCf=v||{};$('cfState').textContent=cfStatusText(lastCf);$('cfToggle').textContent=t(lastCf.enabled?'cfStop':'cfStart');const hasUrl=!!lastCf.publicUrl;$('cfUrlRow').hidden=!hasUrl;$('cfMobileHint').hidden=!hasUrl;if(hasUrl){$('cfUrl').href=lastCf.publicUrl;$('cfUrl').textContent=lastCf.publicUrl}clearTimeout(cfPollTimer);if(lastCf.status==='starting'||lastCf.status==='installing')cfPollTimer=setTimeout(()=>showTunnel().catch(()=>{}),1500)}
async function showTunnel(){cfShow(await api('tunnel'))}
$('cfToggle').onclick=()=>action(async()=>{const b={enabled:!lastCf.enabled};const tok=$('cfToken').value.trim();if(tok)b.token=tok;cfShow(await post('tunnel',b));$('cfToken').value=''});
$('cfSaveToken').onclick=()=>action(async()=>{cfShow(await post('tunnel',{enabled:true,token:$('cfToken').value.trim()}));$('cfToken').value=''});
$('cfCopy').onclick=()=>{if(lastCf.publicUrl&&navigator.clipboard)navigator.clipboard.writeText(lastCf.publicUrl).then(()=>notice(t('cfCopied'))).catch(()=>{})};

// Mod Hub: GET/POST /v1/sc5000/mods, upload via POST /v1/sc5000/mods/upload.
async function modReq(path,opts){const r=await fetch('/v1/sc5000/'+path,opts);let v={};try{v=await r.json()}catch(e){}if(!r.ok)throw Error(v.error||r.status);return v}
const modPost=b=>modReq('mods',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let lastMods=null;
function modBtn(label,fn,cls){const b=document.createElement('button');b.className='btn'+(cls?' '+cls:'');b.textContent=label;b.onclick=()=>action(async()=>{await fn();await showMods()});return b}
function renderMods(v){lastMods=v;const list=Array.isArray(v)?v:(v.mods||[]);$('modQuar').hidden=!(v&&v.safeModeQuarantined);const box=$('modRows');box.replaceChildren();
 if(!list.length){const e=document.createElement('small');e.textContent=t('modEmpty');box.append(e)}
 for(const m of list){const id=m.id||m.name,row=document.createElement('div');row.className='row';const info=document.createElement('span'),nm=document.createElement('b');nm.textContent=(m.name||id)+(m.version?' v'+m.version:'');info.append(nm);
  const tags=[].concat(m.category||m.tags||[]).concat(m.official?['OFFICIAL']:[]).concat(m.drive==='internal'?['INTERNAL']:[]);
  for(const x of tags){const g=document.createElement('i');g.className='tag';g.style.fontStyle='normal';g.textContent=String(x).toUpperCase();info.append(g)}
  const q=m.qmlCount??m.qml_count??(Array.isArray(m.qml)?m.qml.length:undefined),sub=document.createElement('small');sub.textContent=[m.author?t('modAuthor')+' '+m.author:'',q!==undefined?t('modQml')+': '+q:'',id].filter(Boolean).join(' · ');info.append(sub);row.append(info);
  const installed=m.installed!==false;
  if(!installed)row.append(modBtn(t('modInstall'),()=>modPost({id,action:'install'}),'primary'));
  else{const sw=document.createElement('label');sw.className='sw';const c=document.createElement('input');c.type='checkbox';c.checked=!!m.enabled;c.onchange=()=>action(async()=>{try{await modPost({id,enabled:c.checked})}finally{await showMods()}});sw.append(c,document.createElement('span'));row.append(sw)}
  if(installed&&(m.drive==='internal'||id==='tailscale-remote'))row.append(modBtn(t('modUninstall'),async()=>{if(confirm(t('modConfirm')))await modPost({id,action:'uninstall'})}));
  box.append(row)}}
async function showMods(){renderMods(await modReq('mods'))}
$('modQuarReset').onclick=()=>action(async()=>{await modPost({action:'quarantine_reset'});await showMods()});
async function modUpload(f){if(!f)return;if(!/\.(tar\.gz|tgz)$/i.test(f.name)){notice(t('modBad'));return}$('modUp').textContent=t('modUploading',f.name);try{const v=await modReq('mods/upload',{method:'POST',headers:{'Content-Type':'application/gzip'},body:f});$('modUp').textContent=t('modDone',v.id||v.name||f.name)}catch(e){$('modUp').textContent='';throw e}await showMods()}
$('modFile').onchange=e=>{const f=e.target.files[0];e.target.value='';action(()=>modUpload(f))};
$('modDrop').ondragover=e=>{e.preventDefault();$('modDrop').style.borderColor='var(--accent)'};$('modDrop').ondragleave=()=>{$('modDrop').style.borderColor=''};
$('modDrop').ondrop=e=>{e.preventDefault();$('modDrop').style.borderColor='';const f=e.dataTransfer.files[0];action(()=>modUpload(f))};
applyLang();renderSessions();renderDrives();
action(async()=>{const v=await api('ui');if(!localStorage.getItem('enginex-console-lang')&&LANGS.includes(v.language))setLang(v.language,false);showUI(v);await showDrives();await showRelay();await showTunnel().catch(()=>{});await showSpotify();await showBpm();await showBroadcast();await showTailscale().catch(()=>{});await showSSH().catch(()=>{});await showGen2().catch(()=>{});await showMods().catch(()=>{});await refreshSessions();await jobs()});setInterval(()=>{jobs().catch(()=>{})},2000);
</script></html>
